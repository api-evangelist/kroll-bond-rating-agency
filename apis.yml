aid: kroll-bond-rating-agency
name: Kroll Bond Rating Agency
description: >-
  Kroll Bond Rating Agency (KBRA) is a full-service credit rating agency founded in 2010 by Jules Kroll
  and headquartered in New York, with offices in Dresher PA, Frederick MD, Chicago, Dublin, London, and
  Tokyo. KBRA is registered with the U.S. SEC as a Nationally Recognized Statistical Rating Organization
  and with ESMA and the UK FCA through its Irish and UK entities. It has issued 96,000+ ratings covering
  $4.78 trillion of rated issuance across ABS, CMBS, RMBS, structured credit, corporates, financial
  institutions, funds, insurance, project finance, public finance, and sovereigns. KBRA distributes
  ratings and analytics commercially through the KBRA Analytics product family — Ratings Feed, Credit
  Intelligence, Direct Lending Deals, Premium, Credit Profile (KCP), and Financial Intelligence (KFI).
  KBRA publishes no public API or developer portal; machine access is contract-gated and delivered as
  bulk feeds over email/FTP/SFTP, through the Snowflake Marketplace, or via Bloomberg, Aladdin, and
  FactSet.
